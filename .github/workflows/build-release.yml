name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Config/Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"

      - name: Run unit and integration tests for core services
        run: ./script/test.sh

      - name: Build Release app and CLI
        run: ./script/build.sh

      - name: Verify the Xcode project also builds
        run: |
          xcodebuild -project YTFloat.xcodeproj -scheme YTFloat \
            -configuration Release -derivedDataPath .build/xcode \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY=- build

      - name: Package app and checksum
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./script/package_release.sh --no-build

      - name: Upload download artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YTFloat-macOS-${{ matrix.arch }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download both builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: YTFloat-macOS-*
          merge-multiple: true
          path: release

      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd release && sha256sum --check ./*.sha256)
          cat > release-notes.md <<'NOTES'
          A small native macOS floating YouTube player with Liquid Glass controls.

          Download **arm64** for Apple Silicon or **x86_64** for Intel. Extract the ZIP and move YTFloat.app to Applications.

          The CLI is inside `YTFloat.app/Contents/Helpers/ytfloat`. See the repository README for installation and usage.

          Requires macOS 14 or later. Liquid Glass is available on macOS 26 and later.

          These builds are ad-hoc signed. They are not Developer ID signed or notarized; macOS may require approval in Privacy & Security when opening a downloaded app.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag \
              --title "YTFloat ${RELEASE_TAG#v}" --generate-notes --notes-file release-notes.md
          fi
